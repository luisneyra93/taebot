<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAEBot — Control</title>
  <link rel="stylesheet" href="/styles.css?v=neon1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <div>
      <p class="brand">TAEBot</p>
      <h1>Control de transacciones</h1>
    </div>
    <button type="button" id="btn-refresh" class="btn primary">Actualizar</button>
  </header>

  <main>
    <section class="bots" id="bots-panel" aria-label="Bots"></section>

    <section class="saldos-wrap">
      <div class="tx-head">
        <h2>Switcher de proveedores</h2>
        <div class="filters">
          <button type="button" id="btn-switcher-start" class="btn ok">Iniciar switcher</button>
          <button type="button" id="btn-switcher-stop" class="btn stop">Detener switcher</button>
        </div>
      </div>
      <section class="bots" id="switcher-panel" aria-label="Switcher"></section>
    </section>

    <section class="saldos-wrap">
      <div class="tx-head">
        <h2>Asignación de saldo</h2>
        <div class="filters">
          <button type="button" id="btn-saldo-start" class="btn ok">Iniciar saldos</button>
          <button type="button" id="btn-saldo-stop" class="btn stop">Detener saldos</button>
        </div>
      </div>
      <section class="bots" id="saldos-panel" aria-label="Saldos"></section>
    </section>

    <section class="tx">
      <div class="tx-head">
        <h2>Transacciones</h2>
        <div class="filters">
          <label>
            Desde
            <input type="date" id="fecha-inicio" value="2025-01-01" />
          </label>
          <label>
            Hasta
            <input type="date" id="fecha-fin" />
          </label>
          <label>
            Página
            <input type="number" id="page" min="1" value="1" />
          </label>
          <label>
            Límite
            <input type="number" id="limit" min="1" max="100" value="20" />
          </label>
        </div>
      </div>
      <p id="tx-meta" class="muted" hidden></p>
      <p id="tx-error" class="error" hidden></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Caja</th>
              <th>Referencia</th>
              <th>SKU</th>
              <th>Marca</th>
              <th>Monto</th>
              <th>Id externa</th>
              <th>TRN</th>
              <th>Estatus</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody id="tx-body">
            <tr><td colspan="10" class="muted">Sin datos. Pulsa Actualizar.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js?v=4"></script>
</body>
</html>
